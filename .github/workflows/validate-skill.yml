name: Validate Skill.md Specification

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "skills/**"
      - "*.md"
      - ".github/workflows/validate-skill.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "skills/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

jobs:
  validate-spec:
    name: Lint Frontmatter & Markdown Syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate YAML Frontmatter (Zero-Dependency)
        run: |
          node -e '
            const fs = require("fs");
            const file = "skills/anti-repetition-v3.md";

            if (!fs.existsSync(file)) {
              console.error(`Missing required skill file: ${file}`);
              process.exit(1);
            }

            const content = fs.readFileSync(file, "utf8");
            const match = content.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!match) {
              console.error(`File ${file} does not contain valid YAML frontmatter delimiters (---)`);
              process.exit(1);
            }

            const frontmatter = match[1];
            const requiredKeys = ["name", "scope", "execution_priority"];
            let hasError = false;

            for (const key of requiredKeys) {
              const regex = new RegExp(`^${key}:\\s*(.+)$`, "m");
              const keyMatch = frontmatter.match(regex);
              if (!keyMatch || !keyMatch[1].trim()) {
                console.error(`Missing or empty required frontmatter field: "${key}" in ${file}`);
                hasError = true;
              } else {
                console.log(`✓ Frontmatter valid: ${key} = "${keyMatch[1].trim()}"`);
              }
            }

            if (hasError) process.exit(1);
            console.log(`✓ All frontmatter fields in ${file} verified successfully.`);
          '

      - name: Validate Markdown Structure & Headers
        run: |
          node -e '
            const fs = require("fs");
            const skillFile = "skills/anti-repetition-v3.md";
            const readmeFile = "README.md";

            const skillContent = fs.readFileSync(skillFile, "utf8");
            const requiredSections = [
              "## 1. Absolute Prohibition on Conversational Filler",
              "## 2. Strict Lexical & Stylistic Boundaries",
              "## 3. Structural & Engineering Mandates"
            ];

            for (const section of requiredSections) {
              if (!skillContent.includes(section)) {
                console.error(`Missing expected section in ${skillFile}: "${section}"`);
                process.exit(1);
              }
            }
            console.log(`✓ ${skillFile} structure verified.`);

            if (fs.existsSync(readmeFile)) {
              const readmeContent = fs.readFileSync(readmeFile, "utf8");
              if (!readmeContent.includes("Zero-Fluff-skill.md")) {
                console.error("README.md is missing expected repository header");
                process.exit(1);
              }
              console.log(`✓ ${readmeFile} verified.`);
            }
          '
